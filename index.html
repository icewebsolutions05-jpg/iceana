<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICE Quiz Guide</title>
<script>
/* theme: saved choice, else the device setting; set before first paint so there is no flash */
(function(){var d=document.documentElement,m;try{m=localStorage.getItem('theme')}catch(e){}
if(m!=='dark'&&m!=='light')m=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';d.dataset.theme=m;
/* coming from another page of this site (not a reload): skip the intro animations */
try{var t=performance.getEntriesByType('navigation')[0];if(document.referrer&&new URL(document.referrer).origin===location.origin&&!(t&&t.type==='reload'))d.classList.add('no-intro')}catch(e){}})();
</script>
<style>
:root{--brand:#0880e8;--brand-dk:#082f6b;--nav-h:56px;--nav-end-r:28px;--nav-top:10px;
 --bg:#fefefe;--tx:#14213d;--mu:#5b6478;--h1a:#082f6b}
:root[data-theme="dark"]{--bg:#0f1420;--tx:#e8edf7;--mu:#9aa6bd;--h1a:#6cc3ff;color-scheme:dark}
@media (min-width:900px){:root{--nav-h:64px;--nav-end-r:32px;--nav-top:16px}}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Arial,sans-serif}

/* ===== NAVBAR: a circle drops in from above the screen, then spreads sideways into a pill; the links fade in ===== */
.nav{position:fixed;top:var(--nav-top);left:8px;right:8px;z-index:100;height:var(--nav-h);color:#fff;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.nav__inner{position:relative;height:100%;background:var(--brand);border-radius:var(--nav-end-r)}
/* logo chip: light background so the blue logo stays visible on the blue navbar, in both themes */
.nav__logo{position:absolute;z-index:2;left:5px;top:5px;bottom:5px;display:flex;align-items:center;padding:0 12px;border-radius:calc(var(--nav-h)/2 - 5px);background:#fefefe}
.nav__logo img{display:block;height:calc(100% - 8px);width:auto}
.nav ul{list-style:none;margin:0;padding:0 8px;height:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.nav a{display:block;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 26px;border-radius:calc(var(--nav-h)/2)}
.nav a[aria-current="page"]{background:var(--brand-dk)}
.theme{display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;transition:background .2s}
.theme:hover{background:rgba(255,255,255,.32)}
.theme svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
@media (min-width:900px){
 .nav{left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px)}
 .nav ul{padding:0 12px;min-width:360px}
 .nav a{font-size:15px;padding:11px 34px}
 .theme{width:44px;height:44px}
}

.hero{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(var(--nav-top) + var(--nav-h) + 30px) 20px 40px}
.hero h1{margin:0 0 8px;font-size:clamp(1.7rem,6vw,2.6rem);background:linear-gradient(135deg,var(--h1a),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;color:var(--mu);max-width:30ch}

@keyframes navPop{from{transform:translateY(calc(-100% - var(--nav-top) - 60px))}to{transform:none}}
@keyframes navExpand{
 from{clip-path:inset(0 calc(50% - var(--nav-h)/2) 0 calc(50% - var(--nav-h)/2) round calc(var(--nav-h)/2))}
 to{clip-path:inset(0 0 0 0 round var(--nav-end-r))}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion:no-preference){
 body{transition:background .3s,color .3s}
 .nav__inner{animation:navPop .9s cubic-bezier(.34,1.56,.64,1) .1s 1 both,navExpand 1.3s cubic-bezier(.65,0,.25,1) 1.55s 1 both}
 .nav ul,.nav__logo{animation:fadeIn .6s ease 2.25s 1 both}
 .hero > div{animation:fadeIn .7s ease 2.6s 1 both}
 .no-intro .nav__inner,.no-intro .nav ul,.no-intro .nav__logo,.no-intro .hero > div{animation:none}
}
</style></head>
<body>
<nav class="nav"><div class="nav__inner">
 <a class="nav__logo" href="https://icewebsolutions.vercel.app" target="_blank" rel="noopener" aria-label="ICE Web Solutions"><img src="logo-still.png" alt="ICE Web Solutions"></a>
 <ul>
 <li><a href="index.html" aria-current="page">Home</a></li>
 <li><button class="theme" id="theme" type="button" aria-label="Switch theme">
  <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
 </button></li>
</ul></div></nav>
<main class="hero"><div>
 <h1>Anatomy Quiz Guide</h1>
 <p>Study, test and remember. Built by students, for students.</p>
</div></main>
<script>
document.getElementById('theme').onclick=function(){
 var d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';
 d.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}
};
</script>
</body></html>
